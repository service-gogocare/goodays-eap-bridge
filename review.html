<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>審核照顧時數申請 — 好日子 EAP</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="topbar">好日子 EAP · 人資審核</div>
  <div class="container">

    <!-- 載入中 -->
    <div class="card" id="loadingCard">
      <h2><span class="spinner" style="border-color:rgba(46,125,91,.3);border-top-color:#2e7d5b;"></span>驗證審核連結中…</h2>
    </div>

    <!-- 連結錯誤 -->
    <div class="card hidden" id="errorCard">
      <h1>無法開啟審核頁</h1>
      <div class="alert alert-error" id="errorMsg"></div>
      <p class="hint">若連結已過期，請聯繫系統管理者重新產生審核通知。</p>
    </div>

    <!-- passcode 閘（僅在啟用時顯示） -->
    <div class="card hidden" id="passcodeCard">
      <h2>請輸入審核密碼</h2>
      <p class="lead">為確認您的身分，請輸入人資審核密碼。</p>
      <div id="passcodeError" class="alert alert-error hidden"></div>
      <div class="field">
        <label class="field-label" for="passcodeInput">審核密碼</label>
        <input type="password" id="passcodeInput" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="passcodeBtn">確認</button>
    </div>

    <!-- 案件明細 + 審核 -->
    <div class="card hidden" id="detailCard">
      <h1>照顧時數申請審核</h1>
      <div id="reviewedBanner" class="alert alert-info hidden"></div>
      <div id="overLimitBanner" class="alert alert-warn hidden"></div>

      <div class="detail-row"><div class="k">案件編號</div><div class="v" id="dAid"></div></div>
      <div class="detail-row"><div class="k">員工姓名</div><div class="v" id="dName"></div></div>
      <div class="detail-row"><div class="k">廠區／部門</div><div class="v" id="dFactory"></div></div>
      <div class="detail-row"><div class="k">身分別</div><div class="v" id="dIdentity"></div></div>
      <div class="detail-row"><div class="k">被照顧者關係</div><div class="v" id="dRelation"></div></div>
      <div class="detail-row"><div class="k">申請天數</div><div class="v" id="dDays"></div></div>
      <div class="detail-row"><div class="k">年度已用天數</div><div class="v" id="dYearly"></div></div>
      <div class="detail-row"><div class="k">提交時間</div><div class="v" id="dSubmitted"></div></div>
      <div class="detail-row"><div class="k">佐證附件</div><div class="v" id="dAttachment"></div></div>

      <div id="reviewError" class="alert alert-error hidden" style="margin-top:20px;"></div>

      <div id="rejectReasonField" class="field hidden" style="margin-top:20px;">
        <label class="field-label" for="rejectReason">退件原因 <span class="req">*</span></label>
        <textarea id="rejectReason" placeholder="請說明退件原因，員工將收到此說明以便補件重新申請。"></textarea>
      </div>

      <div class="btn-row" id="actionButtons">
        <button class="btn btn-primary" id="approveBtn">核准並發放優惠代碼</button>
        <button class="btn btn-danger" id="rejectBtn">退件</button>
      </div>
    </div>

    <!-- 審核完成 -->
    <div class="card hidden" id="doneCard">
      <h1 id="doneTitle"></h1>
      <div class="alert alert-success" id="doneMsg"></div>
    </div>

  </div>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    var IDENTITY_LABELS = {
      disability: '具有效期間內身心障礙證明',
      major_illness: '具有效期間內全民健康保險重大傷病資格',
      medical_record: '具三個月內就醫或手術紀錄',
      foreign_caregiver_eligible: '符合聘僱外國人從事家庭看護工作之被看護者資格',
      ltc_level_2_8: '經長照管理中心評估屬長照需要等級第 2 至 8 級'
    };

    var token = new URLSearchParams(location.search).get('token') || '';
    var appData = null;
    var rejectMode = false;

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }
    function fmt(iso) {
      if (!iso) return '—';
      try {
        var d = new Date(iso);
        return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' +
          ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
      } catch (e) { return iso; }
    }

    async function init() {
      if (!token) { return fail('缺少審核連結參數，請由審核通知信中的連結進入。'); }
      try {
        appData = await window.API.get({ action: 'verifyToken', token: token });
        hide('loadingCard');
        if (appData.passcodeRequired) {
          show('passcodeCard');
        } else {
          renderDetail();
        }
      } catch (err) {
        fail(err.message || '審核連結無效。');
      }
    }

    function fail(msg) {
      hide('loadingCard'); hide('passcodeCard'); hide('detailCard');
      document.getElementById('errorMsg').textContent = msg;
      show('errorCard');
    }

    document.getElementById('passcodeBtn').addEventListener('click', async function () {
      var pcErr = document.getElementById('passcodeError');
      pcErr.classList.add('hidden');
      var code = document.getElementById('passcodeInput').value.trim();
      if (!code) { pcErr.textContent = '請輸入審核密碼。'; pcErr.classList.remove('hidden'); return; }

      var btn = this;
      btn.disabled = true;
      var old = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>驗證中…';
      try {
        // 帶密碼重新驗證：正確才會回傳完整明細（否則後端擋下，不外洩個資）
        appData = await window.API.get({ action: 'verifyToken', token: token, passcode: code });
        hide('passcodeCard');
        renderDetail();
      } catch (err) {
        pcErr.textContent = err.message || '密碼錯誤，請重新輸入。';
        pcErr.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = old;
      }
    });

    // 密碼欄按 Enter＝按「確認」
    document.getElementById('passcodeInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('passcodeBtn').click(); }
    });

    function renderDetail() {
      document.getElementById('dAid').textContent = appData.applicationId;
      document.getElementById('dName').textContent = appData.employeeName;
      document.getElementById('dFactory').textContent = appData.factory + (appData.dept ? '／' + appData.dept : '');
      document.getElementById('dIdentity').textContent = IDENTITY_LABELS[appData.identityType] || appData.identityType;
      document.getElementById('dRelation').textContent = appData.careTargetRelation || '—';
      document.getElementById('dDays').textContent = appData.requestedDays + ' 天';
      document.getElementById('dYearly').textContent = appData.yearlyUsedDays + ' 天（年度上限 ' + appData.yearlyLimit + ' 天）';
      document.getElementById('dSubmitted').textContent = fmt(appData.submittedAt);

      var att = document.getElementById('dAttachment');
      if (appData.attachmentUrl) {
        att.innerHTML = '<a href="' + appData.attachmentUrl + '" target="_blank" rel="noopener">開啟附件（新分頁）</a>' +
          (appData.attachmentName ? '<br><span class="hint">' + appData.attachmentName + '</span>' : '');
      } else {
        att.textContent = '（無附件）';
      }

      if (appData.overLimitFlag) {
        var ob = document.getElementById('overLimitBanner');
        ob.textContent = '注意：此員工年度累計（含本次）已超過上限 ' + appData.yearlyLimit + ' 天，請審慎評估。';
        show('overLimitBanner');
      }

      show('detailCard');

      // 若已審核，顯示狀態並隱藏操作
      if (appData.status !== 'pending') {
        var banner = document.getElementById('reviewedBanner');
        banner.textContent = appData.status === 'approved'
          ? '此案件已核准，優惠代碼：' + (appData.voucherCode || '')
          : '此案件已退件，原因：' + (appData.rejectReason || '');
        show('reviewedBanner');
        hide('actionButtons');
      }
    }

    document.getElementById('rejectBtn').addEventListener('click', function () {
      if (!rejectMode) {
        // 第一次點擊：展開原因欄
        rejectMode = true;
        show('rejectReasonField');
        this.textContent = '確認退件';
        document.getElementById('approveBtn').classList.add('hidden');
        return;
      }
      submitReview('reject');
    });

    document.getElementById('approveBtn').addEventListener('click', function () {
      submitReview('approve');
    });

    async function submitReview(decision) {
      var reviewError = document.getElementById('reviewError');
      reviewError.classList.add('hidden');

      var payload = { action: 'reviewApplication', token: token, decision: decision };
      if (decision === 'reject') {
        var reason = document.getElementById('rejectReason').value.trim();
        if (!reason) { reviewError.textContent = '請填寫退件原因。'; reviewError.classList.remove('hidden'); return; }
        payload.rejectReason = reason;
      }
      var pc = document.getElementById('passcodeInput');
      if (pc) payload.passcode = pc.value.trim();

      // 鎖定按鈕避免重複提交
      var approveBtn = document.getElementById('approveBtn');
      var rejectBtn = document.getElementById('rejectBtn');
      approveBtn.disabled = true; rejectBtn.disabled = true;
      var activeBtn = decision === 'approve' ? approveBtn : rejectBtn;
      var oldText = activeBtn.textContent;
      activeBtn.innerHTML = '<span class="spinner"></span>處理中…';

      try {
        var data = await window.API.post(payload);
        hide('detailCard');
        var title = document.getElementById('doneTitle');
        var msg = document.getElementById('doneMsg');
        if (data.status === 'approved') {
          title.textContent = '審核完成 ✅';
          msg.textContent = '已核准，優惠代碼 ' + data.voucherCode + ' 已寄送給員工。';
        } else {
          title.textContent = '已退件';
          msg.textContent = '退件通知已寄送給員工。';
        }
        show('doneCard');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        // passcode 錯誤 → 回到 passcode 輸入
        if (err.code === 'INVALID_PASSCODE') {
          reviewError.textContent = err.message;
        } else if (err.code === 'ALREADY_REVIEWED') {
          reviewError.textContent = err.message;
        } else {
          reviewError.textContent = err.message || '審核失敗，請稍後再試。';
        }
        reviewError.classList.remove('hidden');
        approveBtn.disabled = false; rejectBtn.disabled = false;
        activeBtn.textContent = oldText;
      }
    }

    init();
  </script>
</body>
</html>
