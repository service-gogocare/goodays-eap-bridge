<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>好日子 EAP 照顧時數支持計畫</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="topbar">好日子 EAP 照顧時數支持計畫</div>
  <div class="container">
    <div class="card">
      <h1>歡迎使用照顧時數申請平台</h1>
      <p class="lead">本平台協助日月光集團員工線上申請照顧時數，經人資審核通過後，
        將以電子郵件寄送優惠代碼與兌換連結，導向「派派小幫手」預約到府服務。</p>
    </div>

    <div class="card">
      <h2>請選擇您要進行的操作</h2>
      <div class="nav-links">
        <a href="apply.html">
          我要申請照顧時數
          <span class="sub">填寫申請表、上傳佐證文件</span>
        </a>
        <a href="status.html">
          查詢我的申請進度
          <span class="sub">輸入案件編號查看審核結果</span>
        </a>
      </div>
    </div>

    <div class="card">
      <p class="hint">人資審核人員請由審核通知信中的連結進入審核頁。<br>
        本平台為原型示範（DEMO），不處理實際派工與兌換。</p>
    </div>
  </div>
</body>
</html>
